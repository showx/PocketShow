    $("btnRecords").onclick = () => openRecordsView();
    $("btnWatchSettings").onclick = () => {
      if (watchSettingsOpen) closeDrawer();
      else openWatchSettings();
    };
    $("monitorAll").onclick = () => {
      const ids = currentCameras().map((cam) => cam.id);
      if (!ids.length) return;
      setMonitorIds(ids, `已监测 ${ids.length} / ${ids.length} 路`);
    };
    $("monitorInvert").onclick = () => {
      const cameras = currentCameras();
      const next = cameras.filter((cam) => !cam.monitor).map((cam) => cam.id);
      if (!next.length) return toast("反选后会一路都不监测");
      setMonitorIds(next);
    };
    $("drawer").addEventListener("click", (e) => { if (e.target === $("drawer")) closeDrawer(); });

    let holdTimer = null;
    let keys = { left: false, right: false, up: false, down: false };
    const dirs = {
      left: () => ({ yaw: -speed(), pitch: 0 }),
      right: () => ({ yaw: speed(), pitch: 0 }),
      up: () => ({ yaw: 0, pitch: speed() }),
      down: () => ({ yaw: 0, pitch: -speed() }),
      stop: () => ({ yaw: 0, pitch: 0, stop: true }),
    };
    function speed() { return Number($("camSpeed").value) / 100; }
    async function sendGimbal(body) {
      const data = await api("/api/gimbal", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      paintGimbal(data);
      return data;
    }
    let lastAlarm = false;
    let audioCtx = null;
    function beepAlarm() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const beep = (freq, at) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "square";
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.09, audioCtx.currentTime + at);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + at + 0.22);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + at);
          osc.stop(audioCtx.currentTime + at + 0.24);
        };
        beep(880, 0);
        beep(660, 0.28);
        beep(880, 0.56);
      } catch (_) {}
    }
    function paintStation(watch) {
      const pill = $("stationPill");
      const bar = $("alarmBar");
      const w = watch || {};
      const state = w.state || "waiting";
      const alarm = !!(w.alarm && w.fresh && w.on_duty !== false);
      pill.classList.remove("desk", "away", "alarm", "on", "off", "offduty");
      if (state === "at_desk") pill.classList.add("desk", "on");
      else if (state === "away") pill.classList.add("away");
      else if (alarm) pill.classList.add("alarm");
      else if (state === "off_hours") pill.classList.add("offduty", "off");
      else pill.classList.add("off");
      pill.innerHTML = `<i></i> ${w.label || "工位等待"}`;
      document.body.classList.toggle("alarming", alarm);
      bar.classList.toggle("show", alarm);
      bar.hidden = !alarm;
      $("alarmDetail").textContent = alarm ? (w.detail || `已离开工位 ${Math.floor(w.away_s || 0)} 秒`) : "";
      if (alarm && !lastAlarm) beepAlarm();
      lastAlarm = alarm;
    }
    function paintDevice(data) {
      const pill = $("devicePill");
      const on = !!data.online;
      const kind = data.kind || (data.capture === "rtsp" ? "rtsp" : "");
      pill.classList.toggle("on", on);
      pill.classList.toggle("off", !on);
      pill.innerHTML = kind === "rtsp"
        ? `<i></i> 局域网 ${on ? "在线" : "离线"}`
        : `<i></i> Pocket 3 ${on ? "在线" : "离线"}`;
      if (data.capture_settings) {
        captureSettings = data.capture_settings;
        if (view === "watch") paintMonitorBar();
      }
      const extra = (data.watch && data.watch.detail) ? ` · ${data.watch.detail}` : "";
      $("deviceDetail").textContent = (data.detail || "") + extra;
      paintStation(data.watch);
      if (data.scene) {
        sceneState = { ...sceneState, ...data.scene };
        paintScene(sceneState);
      }
      if (data.geomap) {
        mapState = { ...mapState, ...data.geomap };
        paintMap(mapState);
      }
      if (data.mocap) {
        mocapState = { ...mocapState, ...data.mocap };
        paintMocap(mocapState);
      }
      if (data.preview) latestPreview = data.preview;
      paintLive(data.preview);
    }
    function paintLive(preview) {
      const grid = $("liveGrid");
      const empty = $("liveEmpty");
      if (!grid || !empty) return;
      const cameras = (preview && preview.cameras) || [];
      const fresh = !!(preview && preview.fresh);
      const ids = cameras.map((cam) => cam.id || "").filter(Boolean);
      const key = ids.join("|") || (fresh ? "*" : "");
      empty.hidden = fresh && (ids.length > 0 || key === "*");
      if (grid.dataset.ids !== key) {
        grid.dataset.ids = key;
        for (const node of [...grid.querySelectorAll(".live-tile")]) node.remove();
        const tiles = ids.length ? cameras.filter((cam) => cam.id) : (fresh ? [{ id: "", name: "监测" }] : []);
        for (const cam of tiles) {
          const tile = document.createElement("div");
          tile.className = "live-tile";
          const img = document.createElement("img");
          img.alt = cam.name || cam.id || "监测画面";
          img.src = cam.id ? "/api/preview/" + encodeURIComponent(cam.id) : "/api/preview";
          img.addEventListener("click", (ev) => {
            if (view !== "watch") return;
            const pt = imageContentPoint(img, ev);
            if (!pt) return;
            const camNow = ((latestPreview.cameras || []).find((row) => row.id === cam.id)) || cam;
            showSeatPick({
              ...pt,
              camera_id: cam.id || "",
              camera_name: cam.name || camNow.name || "",
              box: hitBox(camNow.boxes || cameraBoxes(cam.id), pt.nx, pt.ny),
              clientX: ev.clientX,
              clientY: ev.clientY,
            });
          });
          tile.appendChild(img);
          grid.appendChild(tile);
        }
      }
      for (const img of grid.querySelectorAll(".live-tile img")) {
        img.classList.toggle("off", !fresh);
      }
    }
    function paintScene(scene) {
      const box = $("sceneNow");
      if (!box) return;
      const s = scene || {};
      const lines = (s.cameras || []).filter((cam) => cam && cam.text && !cam.silent);
      if (!s.enabled && !lines.length && !s.error) {
        box.hidden = true;
        box.innerHTML = "";
        return;
      }
      if (s.error && !lines.length) {
        box.hidden = false;
        box.classList.add("warn");
        box.innerHTML = `<small>场景理解</small>${escapeHtml(s.error)}`;
        return;
      }
      if (!lines.length) {
        box.hidden = !s.enabled;
        box.classList.remove("warn");
        box.innerHTML = s.enabled ? `<small>场景理解</small>已开启，等待第一句…` : "";
        if (!s.enabled) box.hidden = true;
        return;
      }
      box.hidden = false;
      box.classList.remove("warn");
      box.innerHTML = `<small>在干嘛</small>` + lines.map((cam) => {
        const who = cam.name || cam.id || "";
        return `${who ? escapeHtml(who) + " · " : ""}${escapeHtml(cam.text)}`;
      }).join("<br />");
    }
    function paintMap(report) {
      const box = $("mapNow");
      if (!box) return;
      const s = report || {};
      const lines = (s.cameras || []).filter((cam) => cam && (cam.line || cam.ready || cam.warming));
      if (!s.enabled && !lines.length && !s.error) {
        box.hidden = true;
        box.innerHTML = "";
        return;
      }
      if (s.error && !lines.length) {
        box.hidden = false;
        box.classList.add("warn");
        box.innerHTML = `<small>三维重建</small>${escapeHtml(s.error)}`;
        return;
      }
      if (!lines.length) {
        box.hidden = !s.enabled;
        box.classList.remove("warn");
        box.innerHTML = s.enabled ? `<small>三维重建</small>LingBot-Map 已开启，等待位姿…` : "";
        if (!s.enabled) box.hidden = true;
        return;
      }
      box.hidden = false;
      box.classList.remove("warn");
      box.innerHTML = `<small>三维重建</small>` + lines.map((cam) => {
        const who = cam.name || cam.id || "";
        const text = cam.line || (cam.warming ? "预热中" : "重建中");
        return `${who ? escapeHtml(who) + " · " : ""}${escapeHtml(text)}`;
      }).join("<br />");
    }
    function paintMocap(report) {
      const box = $("mocapNow");
      if (!box) return;
      const s = report || {};
      const lines = (s.cameras || []).filter((cam) => cam && cam.line);
      if (!s.enabled && !lines.length && !s.error) {
        box.hidden = true;
        box.innerHTML = "";
        return;
      }
      if (s.error && !lines.length) {
        box.hidden = false;
        box.classList.add("warn");
        box.innerHTML = `<small>动作捕捉</small>${escapeHtml(s.error)}`;
        return;
      }
      if (!lines.length) {
        box.hidden = !s.enabled;
        box.classList.remove("warn");
        box.innerHTML = s.enabled ? `<small>动作捕捉</small>FreeMoCap 已开启，等待骨架…` : "";
        if (!s.enabled) box.hidden = true;
        return;
      }
      box.hidden = false;
      box.classList.remove("warn");
      box.innerHTML = `<small>动作捕捉</small>` + lines.map((cam) => {
        const who = cam.name || cam.id || "";
        return `${who ? escapeHtml(who) + " · " : ""}${escapeHtml(cam.line)}`;
      }).join("<br />");
    }
    let seatClick = null;
    function isComposingKey(ev) {
      return !!(ev.isComposing || ev.keyCode === 229);
    }
    function seatPickOpen() {
      const box = $("seatPick");
      return !!(box && !box.hidden);
    }
    function hideSeatPick() {
      const box = $("seatPick");
      if (box) box.hidden = true;
      seatClick = null;
    }
    function imageContentPoint(img, event) {
      const rect = img.getBoundingClientRect();
      const nw = img.naturalWidth || 0;
      const nh = img.naturalHeight || 0;
      if (!nw || !nh) return null;
      const scale = Math.min(rect.width / nw, rect.height / nh);
      const dw = nw * scale;
      const dh = nh * scale;
      const ox = rect.left + (rect.width - dw) / 2;
      const oy = rect.top + (rect.height - dh) / 2;
      const x = event.clientX - ox;
      const y = event.clientY - oy;
      if (x < 0 || y < 0 || x > dw || y > dh) return null;
      return { nx: x / dw, ny: y / dh, px: event.clientX - rect.left, py: event.clientY - rect.top };
    }
    function hitBox(boxes, nx, ny) {
      let best = null;
      let bestArea = Infinity;
      for (const box of boxes || []) {
        const x1 = Number(box.x1);
        const y1 = Number(box.y1);
        const x2 = Number(box.x2);
        const y2 = Number(box.y2);
        if (![x1, y1, x2, y2].every(Number.isFinite)) continue;
        const loX = Math.min(x1, x2);
        const hiX = Math.max(x1, x2);
        const loY = Math.min(y1, y2);
        const hiY = Math.max(y1, y2);
        if (nx < loX || nx > hiX || ny < loY || ny > hiY) continue;
        const area = Math.max(1e-6, Math.abs(x2 - x1) * Math.abs(y2 - y1));
        if (area < bestArea) {
          best = box;
          bestArea = area;
        }
      }
      return best;
    }
    function cameraBoxes(cameraId) {
      const cameras = (latestPreview && latestPreview.cameras) || [];
      const cam = cameras.find((row) => row.id === cameraId);
      return (cam && cam.boxes) || [];
    }
    function seatPinBody(extra) {
      const body = seatClick && seatClick.camera_id
        ? { camera_id: seatClick.camera_id, camera_name: seatClick.camera_name || "", cx: seatClick.nx, cy: seatClick.ny }
        : { nx: seatClick.nx, ny: seatClick.ny };
      if (seatClick && seatClick.box) {
        body.x1 = seatClick.box.x1;
        body.y1 = seatClick.box.y1;
        body.x2 = seatClick.box.x2;
        body.y2 = seatClick.box.y2;
        body.cx = (Number(body.x1) + Number(body.x2)) / 2;
        body.cy = (Number(body.y1) + Number(body.y2)) / 2;
      }
      return extra ? Object.assign(body, extra) : body;
    }
    async function pinExistingSeat(personId) {
      if (!seatClick) return;
      const updated = await api("/api/people/" + personId + "/seats", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(seatPinBody()),
      });
      merge(updated);
      toast("已记下 " + updated.name + " 在这路摄像头的位置");
      hideSeatPick();
    }
    async function createSeatMark(name) {
      if (!seatClick) return;
      const created = await api("/api/seats", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(seatPinBody({ name: name || "" })),
      });
      merge(created);
      toast("已用画面里这个人登记 " + created.name);
      hideSeatPick();
    }
    function showSeatPick(pt) {
      const roster = people.filter((p) => !p.guest);
      seatClick = pt;
      const box = $("seatPick");
      const list = $("seatPickList");
      const q = $("seatPickQ");
      const title = $("seatPickTitle");
      const hint = $("seatPickHint");
      if (!box || !list || !q) return;
      const fromBox = !!(pt && pt.box);
      const camName = (pt && (pt.camera_name || pt.camera_id)) || "";
      if (title) title.textContent = fromBox ? "用画面里这个人登记" : "这里是谁的工位？";
      if (hint) {
        const labeled = pt && pt.box && pt.box.name ? `画面上标的是「${pt.box.name}」。` : "";
        hint.hidden = !fromBox && !camName;
        hint.textContent = fromBox
          ? `${labeled}记下的是${camName ? "「" + camName + "」" : "这路摄像头"}上的位置。`
          : (camName ? `点在「${camName}」上` : "");
      }
      const paint = () => {
        const needle = (q.value || "").trim();
        const lower = needle.toLowerCase();
        const rows = roster.filter((p) => {
          const hay = ((p.name || "") + " " + (p.note || "")).toLowerCase();
          return !lower || hay.includes(lower);
        });
        const buttons = rows.map((p) => `<button type="button" data-id="${escapeHtml(p.id)}">${escapeHtml(p.name)}</button>`).join("");
        let create = "";
        if (fromBox) {
          create = needle
            ? `<button type="button" class="create" data-create="1">用这个人新建「${escapeHtml(needle)}」</button>`
            : `<button type="button" class="create" data-create="1">用这个人新建</button>`;
        } else if (needle) {
          create = `<button type="button" class="create" data-create="1">新建「${escapeHtml(needle)}」</button>`;
        } else {
          create = `<p class="hint">${roster.length ? "点已有的人，或输入姓名新建标记" : "人物库还没人。输入姓名即可在这里新建工位标记。"}</p>`;
        }
        list.innerHTML = buttons + create;
      };
      q.value = "";
      q.placeholder = fromBox ? "输入姓名，或直接新建" : "搜索或输入新姓名";
      paint();
      q.oninput = (ev) => { if (!ev.isComposing) paint(); };
      q.oncompositionend = paint;
      q.onkeydown = async (ev) => {
        if (ev.key !== "Enter" || isComposingKey(ev)) return;
        ev.preventDefault();
        const name = (q.value || "").trim();
        if (!name) return;
        const exact = roster.find((p) => (p.name || "") === name) || null;
        try {
          if (exact) await pinExistingSeat(exact.id);
          else await createSeatMark(name);
        } catch (err) {
          toast(err.message);
        }
      };
      list.onclick = async (ev) => {
        if (!seatClick) return;
        const createBtn = ev.target.closest("button[data-create]");
        const btn = ev.target.closest("button[data-id]");
        try {
          if (createBtn) {
            const name = (q.value || "").trim();
            if (!name && !fromBox) return toast("先输入姓名");
            await createSeatMark(name);
            return;
          }
          if (!btn) return;
          await pinExistingSeat(btn.dataset.id);
        } catch (err) {
          toast(err.message);
        }
      };
      box.hidden = false;
      const left = Math.min((pt.clientX || 0) + 12, Math.max(8, window.innerWidth - 260));
      const top = Math.min((pt.clientY || 0) + 12, Math.max(8, window.innerHeight - 200));
      box.style.left = left + "px";
      box.style.top = top + "px";
      q.focus();
    }
    function paintGimbal(data) {
      const wifi = data.backend === "wifi";
      const link = !data.connected ? "跟拍未连接" : (wifi ? "WiFi 云台" : "USB 预览（电机未接）");
      const mode = data.mode === "manual" ? (data.holding ? "手动" : "手动停") : "跟拍";
      const motion = `${link} · ${mode}  yaw ${Number(data.applied_yaw || 0).toFixed(2)}  pitch ${Number(data.applied_pitch || 0).toFixed(2)}`;
      $("camStatus").classList.toggle("warn", !wifi);
      if (!data.connected) {
        $("camStatus").textContent = motion + "。按钮指令会记下，但跟拍进程没在跑，镜头不会转。";
      } else if (!wifi) {
        $("camStatus").textContent = motion + "。指令已发出，Pocket 3 云台不会转：当前是 stub。请在相机上打开 WiFi 热点后再用 pocketshow --gimbal wifi。";
      } else {
        $("camStatus").textContent = motion;
      }
    }
    function beginHold(dir) {
      endHold();
      const body = dirs[dir]();
      const pulse = () => sendGimbal(body).catch((err) => toast(err.message));
      pulse();
      holdTimer = setInterval(pulse, 160);
    }
    function endHold() {
      if (holdTimer) clearInterval(holdTimer);
      holdTimer = null;
      sendGimbal({ stop: true }).catch(() => {});
    }
    for (const btn of document.querySelectorAll(".pad [data-dir]")) {
      const dir = btn.dataset.dir;
      if (dir === "stop") {
        btn.onclick = () => sendGimbal({ stop: true });
        continue;
      }
      btn.addEventListener("pointerdown", (ev) => { ev.preventDefault(); btn.setPointerCapture(ev.pointerId); beginHold(dir); });
      btn.addEventListener("pointerup", endHold);
      btn.addEventListener("pointercancel", endHold);
    }
    $("camFollow").onclick = () => sendGimbal({ mode: "follow", yaw: 0, pitch: 0 });
    $("camCenter").onclick = () => sendGimbal({ recenter: true });
    $("camStop").onclick = () => sendGimbal({ stop: true });
    function setDockOpen(open) {
      $("dock").classList.toggle("open", open);
      $("btnCam").classList.toggle("active", open);
      document.body.classList.toggle("dock-open", open);
      if (!open) endHold();
    }
    $("btnCam").onclick = () => setDockOpen(!$("dock").classList.contains("open"));
    $("btnCamClose").onclick = () => setDockOpen(false);
    window.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape" && !isComposingKey(ev) && seatPickOpen()) {
        const q = $("seatPickQ");
        if (q && document.activeElement === q && (q.value || "").trim()) {
          q.value = "";
          q.dispatchEvent(new Event("input"));
          ev.preventDefault();
          return;
        }
        hideSeatPick();
      }
      if (ev.key === "Escape" && watchSettingsOpen) {
        closeDrawer();
        return;
      }
      if (ev.key === "Escape" && $("dock").classList.contains("open")) {
        setDockOpen(false);
        return;
      }
      if (!$("dock").classList.contains("open")) return;
      const tag = (ev.target && ev.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      const map = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };
      const dir = map[ev.key];
      if (!dir || keys[dir]) return;
      ev.preventDefault();
      keys[dir] = true;
      beginHold(dir);
    });
    window.addEventListener("keyup", (ev) => {
      const map = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };
      const dir = map[ev.key];
      if (!dir) return;
      keys[dir] = false;
      endHold();
    });
    window.addEventListener("blur", endHold);

    async function boot() {
      try {
        people = await api("/api/people");
        if (location.hash === "#watch") {
          view = "watch";
          try {
            watchReport = await api("/api/watch");
            captureSettings = await api("/api/capture");
          } catch (err) { toast(err.message); }
        } else if (location.hash === "#present") {
          view = "present";
          try {
            watchReport = await api("/api/watch");
          } catch (err) { toast(err.message); }
        } else if (location.hash === "#records") {
          view = "records";
          try {
            watchReport = await api("/api/watch");
          } catch (err) { toast(err.message); }
        }
        render();
        paintDevice(await api("/api/status"));
        paintGimbal(await api("/api/gimbal"));
      } catch (err) {
        $("summary").textContent = "读取失败：" + err.message;
      }
    }
    boot();
    document.addEventListener("pointerdown", () => {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
      } catch (_) {}
    }, { once: true });
    setInterval(async () => {
      try {
        paintDevice(await api("/api/status"));
        paintGimbal(await api("/api/gimbal"));
      } catch (_) {}
    }, 1500);
    setInterval(async () => {
      try {
        const stayId = selected && selected.id;
        await refreshPeople();
        if (stayId && !people.some((p) => p.id === stayId)) closeDrawer();
      } catch (_) {}
    }, 4000);
  </script>
