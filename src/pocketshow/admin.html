<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PocketShow 人物库</title>
  <style>
    :root {
      --bg: #09090a;
      --panel: #121214;
      --card: #161618;
      --line: rgba(255,255,255,.08);
      --line-strong: rgba(255,255,255,.14);
      --text: #f3f2ee;
      --muted: #8c8b86;
      --faint: #5c5b57;
      --cream: #ece7dc;
      --ink: #121212;
      --live: #8fbf9a;
      --warn: #d4b37a;
      --danger: #d46767;
      --guest: #a7b4c4;
      --green: #8fbf9a;
      --accent: #ece7dc;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0; min-height: 100%; color: var(--text);
      font-family: "SF Pro Text", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
      background:
        radial-gradient(1100px 420px at 8% -8%, rgba(236,231,220,.07), transparent 55%),
        var(--bg);
      letter-spacing: .01em;
    }
    .chrome {
      position: sticky; top: 0; z-index: 5;
      background: rgba(9,9,10,.88); backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 18px 28px 12px; background: transparent;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 220px; }
    .mark {
      width: 34px; height: 34px; border-radius: 10px; flex: none;
      display: grid; place-items: center;
      border: 1px solid var(--line-strong);
      background: linear-gradient(180deg, #1c1c1f, #101012);
    }
    .mark span {
      width: 13px; height: 13px; border-radius: 50%;
      border: 1.5px solid var(--cream);
      box-shadow: inset 0 0 0 3px #101012;
    }
    h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .08em; }
    .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .header-end { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-left: auto; }
    .device-status { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .pills { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .device-pill {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 500;
      border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--muted);
    }
    .device-pill i {
      width: 6px; height: 6px; border-radius: 50%; background: #6b6a66;
    }
    .device-pill.on { color: var(--live); border-color: rgba(143,191,154,.28); background: rgba(143,191,154,.08); }
    .device-pill.on i { background: var(--live); box-shadow: 0 0 0 3px rgba(143,191,154,.18); }
    .device-pill.off { color: var(--muted); }
    .device-detail { color: var(--faint); font-size: 11px; max-width: 360px; text-align: right; line-height: 1.4; }
    .station-pill.desk { color: var(--live); border-color: rgba(143,191,154,.28); background: rgba(143,191,154,.08); }
    .station-pill.desk i { background: var(--live); }
    .station-pill.away { color: var(--warn); border-color: rgba(212,179,122,.28); background: rgba(212,179,122,.08); }
    .station-pill.away i { background: var(--warn); }
    .station-pill.alarm { color: #fff; border-color: rgba(212,103,103,.45); background: #7a2a2a; }
    .station-pill.alarm i { background: #fff; }
    .station-pill.offduty { color: var(--muted); }
    .nav {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 0 28px 16px;
      flex-wrap: wrap;
    }
    .tabs {
      display: flex; padding: 4px; gap: 2px;
      background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 12px;
    }
    .tabs button {
      background: transparent; color: var(--muted); border: 0; box-shadow: none;
      padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
    }
    .tabs button:hover { color: var(--text); background: rgba(255,255,255,.04); }
    .tabs button.active { background: var(--cream); color: var(--ink); }
    .nav-end { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .alarm-bar {
      display: none;
      position: sticky; top: 0; z-index: 6;
      margin: 0; padding: 12px 28px;
      background: #6e2424; color: #fff;
      font-size: 14px; font-weight: 600; letter-spacing: .06em;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .alarm-bar.show { display: flex; align-items: center; gap: 12px; }
    .alarm-bar span { font-size: 13px; font-weight: 400; opacity: .88; letter-spacing: 0; }
    body.alarming { background: #120c0c; }
    body.alarming .chrome { border-bottom-color: rgba(212,103,103,.35); }
    input[type="search"], input[type="text"], input[type="time"], input[type="number"], textarea, select {
      background: var(--card); color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 9px 12px; font: inherit;
    }
    input[type="search"] { min-width: 200px; background: rgba(255,255,255,.03); }
    input:focus, textarea:focus, select:focus {
      outline: none; border-color: rgba(236,231,220,.35);
    }
    textarea { width: 100%; min-height: 72px; resize: vertical; }
    button, .btn {
      border: 0; border-radius: 8px; padding: 9px 14px; font: inherit; cursor: pointer;
      background: var(--cream); color: var(--ink); font-weight: 600;
    }
    button:hover, .btn:hover { filter: brightness(1.04); }
    button.ghost, .btn.ghost {
      background: transparent; color: var(--text); border: 1px solid var(--line);
      font-weight: 500;
    }
    button.ghost:hover { background: rgba(255,255,255,.04); border-color: var(--line-strong); }
    button.danger { background: transparent; color: var(--danger); border: 1px solid rgba(212,103,103,.35); }
    button.danger:hover { background: rgba(212,103,103,.12); }
    button:disabled { opacity: .45; cursor: default; filter: none; }
    button:focus-visible, .btn:focus-visible, input:focus-visible {
      outline: 2px solid rgba(236,231,220,.35); outline-offset: 2px;
    }
    #btnCam.active, #btnWatchSettings.active { border-color: var(--cream); color: var(--cream); }
    main { padding: 28px 28px 96px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 18px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
      cursor: pointer; transition: border-color .18s ease, background .18s ease;
    }
    .card:hover { border-color: var(--line-strong); background: #1a1a1c; }
    .thumb {
      aspect-ratio: 3 / 4; background: #0e0e10 center/cover no-repeat;
      display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 12px;
    }
    .meta { padding: 12px 14px 14px; }
    .meta strong { display: block; font-size: 15px; font-weight: 600; }
    .meta small { color: var(--muted); font-size: 12px; display: block; margin-top: 3px; }
    .badge {
      display: inline-block; margin-top: 8px; padding: 2px 8px; border-radius: 999px;
      background: rgba(212,179,122,.12); color: var(--warn); font-size: 11px; letter-spacing: .04em;
    }
    .badge.guest { background: rgba(167,180,196,.12); color: var(--guest); }
    strong .badge { margin-top: 0; margin-left: 8px; vertical-align: middle; font-weight: 500; }
    .check {
      display: flex; align-items: flex-start; gap: 10px;
      margin: 16px 0 6px; color: var(--text); font-size: 14px; cursor: pointer;
    }
    .check input { margin-top: 3px; accent-color: var(--cream); }
    .banner {
      margin: 0 0 18px; padding: 12px 16px; border-radius: 10px;
      background: rgba(212,179,122,.08); border: 1px solid rgba(212,179,122,.22); color: var(--warn); font-size: 13px;
    }
    .banner button { margin-left: 8px; padding: 6px 10px; font-size: 13px; }
    .empty { text-align: center; padding: 88px 20px; color: var(--muted); line-height: 1.7; }
    .drawer {
      position: fixed; inset: 0; background: rgba(0,0,0,.58); display: none; z-index: 10;
      backdrop-filter: blur(6px);
    }
    .drawer.open { display: block; }
    .panel {
      position: absolute; right: 0; top: 0; height: 100%; width: min(440px, 100%);
      background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 26px 24px 48px;
    }
    .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .kicker { margin: 0 0 4px; color: var(--faint); font-size: 11px; letter-spacing: .14em; }
    .panel-head strong { font-size: 18px; }
    .cover { width: 100%; border-radius: 10px; background: #0e0e10; min-height: 280px; object-fit: cover; display: block; }
    .row { display: flex; gap: 8px; margin: 12px 0; }
    label { display: block; color: var(--muted); font-size: 12px; margin: 16px 0 6px; letter-spacing: .04em; }
    .snaps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .snaps img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
    .snaps img.cover { border-color: var(--cream); }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.55; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(18,18,20,.92); border: 1px solid var(--line-strong);
      padding: 10px 16px; border-radius: 999px; display: none; z-index: 20;
      backdrop-filter: blur(12px); font-size: 13px;
    }
    .drop {
      border: 1px dashed var(--line-strong); border-radius: 10px; padding: 18px; text-align: center;
      color: var(--muted); margin-top: 8px; background: rgba(255,255,255,.02);
    }
    .tag { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(143,191,154,.12); color: var(--live); white-space: nowrap; letter-spacing: .04em; }
    .tag.off { background: rgba(255,255,255,.04); color: var(--muted); }
    .dock {
      display: none;
      position: fixed; right: 20px; bottom: 20px; z-index: 8;
      background: rgba(18,18,20,.94); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px; width: 228px; box-shadow: 0 24px 60px rgba(0,0,0,.45);
      backdrop-filter: blur(16px);
    }
    .dock.open { display: block; }
    .dock-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .dock h2 { margin: 0; font-size: 13px; letter-spacing: .08em; font-weight: 600; }
    .dock .close { padding: 4px 10px; font-size: 12px; }
    .pad { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin: 8px 0; }
    .pad button { padding: 12px 0; font-size: 13px; }
    .dock .status { color: var(--muted); font-size: 12px; line-height: 1.45; margin-top: 8px; }
    .dock .status.warn { color: var(--warn); }
    .dock input[type="range"] { width: 100%; accent-color: var(--cream); }
    body.dock-open main { padding-bottom: 240px; }
    body.view-watch main { display: block; }
    .watch-panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .live-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-start;
      margin-top: 4px;
    }
    .live-tile {
      position: relative;
      background: #0a0a0c;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      line-height: 0;
      cursor: crosshair;
    }
    .live-tile img {
      display: block;
      width: auto;
      height: auto;
      max-width: none;
      background: #0a0a0c;
    }
    .live-tile img.off { opacity: .28; }
    .live-empty {
      display: grid; place-items: center;
      margin: 0; padding: 48px 24px;
      min-height: 160px; flex: 1 1 100%;
      color: var(--muted); font-size: 13px; text-align: center; line-height: 1.6;
    }
    .scene-caption {
      margin-top: 12px;
      padding: 10px 12px;
      background: rgba(16,16,18,.78);
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 13px; line-height: 1.5;
      color: var(--cream);
    }
    .scene-caption small { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
    .scene-caption.warn { color: var(--warn); }
    .scene-event {
      display: flex; justify-content: space-between; gap: 12px; align-items: flex-start;
      padding: 10px 0; border-bottom: 1px solid var(--line);
      font-size: 13px; line-height: 1.45;
    }
    .scene-event:last-child { border-bottom: 0; }
    .scene-event small { color: var(--muted); }
    .seat-pick {
      position: fixed;
      z-index: 12;
      width: 240px;
      max-height: 320px;
      overflow: auto;
      background: rgba(18,18,20,.96);
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 16px 40px rgba(0,0,0,.45);
    }
    .seat-pick p { margin: 0 0 8px; font-size: 13px; }
    .seat-pick input { width: 100%; min-width: 0; margin-bottom: 8px; }
    .seat-pick button {
      display: block; width: 100%; text-align: left;
      background: transparent; color: var(--text); font-weight: 500;
      padding: 7px 8px; margin: 0 0 2px;
    }
    .seat-pick button:hover { background: rgba(255,255,255,.06); }
    .seat-pick button.create { color: var(--cream); margin-top: 6px; }
    .watch-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px;
    }
    .watch-card h3 { margin: 0 0 14px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .08em; }
    .watch-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
    .watch-head h3 { margin: 0; }
    .watch-head-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .watch-status {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      margin: 0 0 12px; padding: 10px 14px;
      background: rgba(255,255,255,.025); border: 1px solid var(--line); border-radius: 10px;
      font-size: 13px;
    }
    .watch-status .facts { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); }
    .watch-status b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    .watch-status .danger b { color: var(--danger); }
    .panel.settings { width: min(480px, 100%); }
    .settings-block { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
    .settings-block h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .08em; }
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; margin-top: 12px; }
    .settings-grid .span-2 { grid-column: 1 / -1; }
    .settings-grid label { margin: 0; }
    .settings-grid input, .settings-grid select { width: 100%; min-width: 0; }
    .settings-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
    .monitor-bar { margin: 10px 0 12px; }
    .monitor-tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .monitor-tools .hint { margin: 0; }
    .monitor-tools .row { margin: 0; gap: 6px; }
    .monitor-tools button { padding: 5px 10px; font-size: 12px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .stat { background: rgba(255,255,255,.025); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 12px; }
    .stat b { display: block; font-size: 22px; margin-top: 6px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .stat span { color: var(--muted); font-size: 11px; letter-spacing: .06em; }
    .hours-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
    .hours-row label { margin: 0; }
    .hours-row input[type="time"] { width: 140px; }
    .hours-row input[type="number"] { width: 110px; }
    .hours-row input[type="text"], .hours-row input[type="password"], .hours-row select { min-width: 140px; }
    .hours-row input.host { min-width: 180px; }
    .stream-pick { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
    .cam-pick { min-width: 220px; }
    .days { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
    .days.monitor-chips { margin: 0; gap: 6px; }
    .monitor-chips .day { padding: 7px 11px; }
    .day {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 500; cursor: pointer;
    }
    .day.on { color: var(--ink); border-color: var(--cream); background: var(--cream); }
    .session {
      display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center;
      background: rgba(255,255,255,.02); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
      margin-top: 8px;
    }
    .session:first-of-type { margin-top: 0; }
    .session.is-alarm { border-color: rgba(212,103,103,.28); background: rgba(212,103,103,.05); }
    .session.is-live { border-color: rgba(143,191,154,.28); }
    .session img, .session .ph {
      width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: #0e0e10;
    }
    .session .ph, .rank .ph { display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 11px; }
    .session .when { font-variant-numeric: tabular-nums; }
    .session-end { text-align: right; }
    .session-end b { display: block; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .session .tag.alarm { background: rgba(212,103,103,.12); color: var(--danger); }
    .rank {
      display: grid; grid-template-columns: 28px 44px 1fr auto; gap: 10px; align-items: center;
      padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer;
    }
    .rank:first-of-type { border-top: 0; }
    .rank .n { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
    .rank img, .rank .ph {
      width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #0e0e10;
    }
    .session small, .rank small { display: block; margin-top: 3px; color: var(--muted); }
    .stat.danger b { color: var(--danger); }
    .stat.live b { color: var(--live); }
    .records-hero .hint { max-width: 520px; text-align: right; }
    .records-hero .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .rank .session-end { text-align: right; }
    .rank .session-end b { display: block; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .records-body {
      display: grid; grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); gap: 16px; align-items: start;
    }
    .records-filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .records-empty { padding: 64px 20px; }
    .records-empty strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
    @media (max-width: 1100px) {
      .records-body { grid-template-columns: 1fr; }
      .records-hero .hint { text-align: left; }
    }
    @media (max-width: 640px) {
      .settings-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 820px) {
      header, .nav, main { padding-left: 16px; padding-right: 16px; }
      input[type="search"] { min-width: 0; width: 140px; }
      .records-hero .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="chrome">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true"><span></span></div>
      <div>
        <h1>POCKETSHOW</h1>
        <div class="sub" id="summary">正在读取名册…</div>
      </div>
    </div>
    <div class="header-end">
      <div class="device-status" id="deviceStatus">
        <div class="pills">
          <span class="device-pill off" id="devicePill"><i></i> Pocket 3 离线</span>
          <span class="device-pill station-pill off" id="stationPill"><i></i> 工位等待</span>
        </div>
        <span class="device-detail" id="deviceDetail">正在检测设备…</span>
      </div>
      <button type="button" id="btnNew">登记新人</button>
    </div>
  </header>
  <nav class="nav">
    <div class="tabs" role="tablist">
      <button type="button" class="active" id="btnPeople">人物库</button>
      <button type="button" id="btnWatch">离岗分析</button>
      <button type="button" id="btnPresent">在岗人员</button>
      <button type="button" id="btnRecords">离岗记录</button>
    </div>
    <div class="nav-end">
      <input id="q" type="search" placeholder="搜索姓名 / 备注" />
      <button type="button" class="ghost" id="btnCam">镜头</button>
    </div>
  </nav>
  </div>
  <div id="alarmBar" class="alarm-bar" hidden>离岗报警<span id="alarmDetail"></span></div>
  <main>
    <div id="banner" class="banner" hidden></div>
    <div id="grid" class="grid"></div>
    <div id="watchLive" class="watch-panel" hidden>
      <section class="watch-card">
        <div class="watch-head">
          <h3>监测画面</h3>
          <div class="watch-head-actions">
            <span class="hint" id="monitorCount"></span>
            <button type="button" class="ghost" id="btnWatchSettings">设置</button>
          </div>
        </div>
        <div id="watchStatus" class="watch-status" hidden></div>
        <p class="hint" style="margin-top:0">点检测框，直接用画面里这个人登记，并记下所在摄像头的位置。点空处仍可指定工位；人物库对不上时，输入姓名即可新建。</p>
        <div id="monitorBar" class="monitor-bar" hidden>
          <div class="monitor-tools">
            <p class="hint">点一下开，再点一下关</p>
            <div class="row">
              <button type="button" class="ghost" id="monitorAll">全开</button>
              <button type="button" class="ghost" id="monitorInvert">反选</button>
            </div>
          </div>
          <div class="days monitor-chips" id="monitorChips"></div>
        </div>
        <div class="live-grid" id="liveGrid">
          <p class="live-empty" id="liveEmpty">打开监测后这里会显示画面。点人框即可登记这个人在这路摄像头上的位置。</p>
        </div>
        <div id="sceneNow" class="scene-caption" hidden></div>
        <div id="mapNow" class="scene-caption" hidden></div>
        <div id="mocapNow" class="scene-caption" hidden></div>
      </section>
    </div>
    <div id="seatPick" class="seat-pick" hidden>
      <p id="seatPickTitle">这里是谁的工位？</p>
      <p class="hint" id="seatPickHint" hidden></p>
      <input id="seatPickQ" type="text" autocomplete="off" placeholder="搜索或输入新姓名" />
      <div id="seatPickList"></div>
    </div>
    <div id="presentPanel" class="watch-panel" hidden></div>
    <div id="recordsPanel" class="watch-panel" hidden></div>
    <div id="empty" class="empty" hidden>还没有相片留底。打开跟拍后会自动抓脸，也可以点「登记新人」上传照片。</div>
  </main>
  <div id="drawer" class="drawer">
    <div class="panel" id="panel"></div>
  </div>
  <div id="toast" class="toast"></div>
  <aside class="dock" id="dock">
    <div class="dock-head">
      <h2>镜头</h2>
      <button type="button" class="ghost close" id="btnCamClose">关闭</button>
    </div>
    <div class="row" style="margin:0 0 8px">
      <button type="button" class="ghost" id="camFollow">跟拍</button>
      <button type="button" class="ghost" id="camCenter">回中</button>
      <button type="button" class="ghost" id="camStop">停</button>
    </div>
    <div class="pad">
      <span></span><button type="button" class="ghost" data-dir="up">上</button><span></span>
      <button type="button" class="ghost" data-dir="left">左</button>
      <button type="button" class="ghost" data-dir="stop">·</button>
      <button type="button" class="ghost" data-dir="right">右</button>
      <span></span><button type="button" class="ghost" data-dir="down">下</button><span></span>
    </div>
    <label style="margin-top:4px">速度</label>
    <input id="camSpeed" type="range" min="15" max="80" value="40" />
    <div class="status" id="camStatus">等待跟拍进程…</div>
  </aside>
  <script>
    const $ = (id) => document.getElementById(id);
    let people = [];
    let selected = null;
    let view = "people";
    let watchReport = null;
    let recordsFilter = "all";
    let captureSettings = null;
    let editingCameraId = null;
    let watchSettingsOpen = false;
    let monitorPaintKey = "";
    let monitorBusy = false;
    let sceneState = { enabled: false, cameras: [], events: [], error: "" };
    let mapState = { enabled: false, cameras: [], events: [], error: "" };
    let mocapState = { enabled: false, cameras: [], events: [], error: "" };
    let latestPreview = { cameras: [], fresh: false };
    const WEEKDAYS = [[1, "一"], [2, "二"], [3, "三"], [4, "四"], [5, "五"], [6, "六"], [7, "日"]];

    async function api(path, opts) {
      const res = await fetch(path, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || data.message || res.statusText);
      return data;
    }

    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 2200);
    }

    function showView(name) {
      if (name !== "watch") hideSeatPick();
      view = name;
      const panels = {
        people: ["grid", "banner", "empty"],
        watch: ["watchLive"],
        present: ["presentPanel"],
        records: ["recordsPanel"],
      };
      for (const id of ["grid", "banner", "empty", "watchLive", "presentPanel", "recordsPanel"]) {
        $(id).hidden = !(panels[name] || []).includes(id);
      }
      $("btnPeople").classList.toggle("active", name === "people");
      $("btnWatch").classList.toggle("active", name === "watch");
      $("btnPresent").classList.toggle("active", name === "present");
      $("btnRecords").classList.toggle("active", name === "records");
      document.body.classList.toggle("view-watch", name === "watch");
      document.body.classList.toggle("view-records", name === "records" || name === "present");
      $("q").hidden = name === "watch";
      const want = name === "watch" ? "#watch" : name === "present" ? "#present" : name === "records" ? "#records" : "";
      if (location.hash !== want) history.replaceState(null, "", want || location.pathname + location.search);
      if (name !== "watch" && watchSettingsOpen) closeDrawer();
      if (name === "watch") paintMonitorBar();
    }

    function render() {
      if (view === "watch") {
        showView("watch");
        $("q").placeholder = "搜索姓名 / 备注";
        renderWatch();
        return;
      }
      if (view === "present") {
        showView("present");
        $("q").placeholder = "筛选姓名";
        renderPresent();
        return;
      }
      if (view === "records") {
        showView("records");
        $("q").placeholder = "筛选姓名";
        renderRecords();
        return;
      }
      showView("people");
      $("q").placeholder = "搜索姓名 / 备注";
      const q = $("q").value.trim().toLowerCase();
      const list = people.filter((p) =>
        !q || (p.name + " " + (p.note || "") + " " + p.id + (p.guest ? " 客人 guest" : "")).toLowerCase().includes(q)
      );
      $("summary").textContent = people.length ? `共 ${people.length} 人` : "空名册";
      const dups = people.flatMap((p) => p.twins || []).filter((x, i, arr) => arr.findIndex((y) => y.a === x.a && y.b === x.b) === i);
      const banner = $("banner");
      if (dups.length) {
        banner.hidden = false;
        banner.innerHTML = `发现 ${dups.length} 组高相似度档案（≥70%）。打开卡片确认后，把重复的一条「并入」另一个。`;
      } else {
        banner.hidden = true;
        banner.textContent = "";
      }
      $("empty").hidden = list.length > 0;
      $("grid").innerHTML = list.map((p) => `
        <article class="card" data-id="${p.id}">
          <div class="thumb" style="${p.photo_url ? `background-image:url('${p.photo_url}?t=${encodeURIComponent(p.updated_at || "")}')` : ""}">
            ${p.photo_url ? "" : "尚无相片"}
          </div>
          <div class="meta">
            <strong>${escapeHtml(p.name)}</strong>
            <small>${[seatLabel(p), p.updated_at].filter(Boolean).join(" · ") || "尚未指定工位"}</small>
            ${p.guest ? `<div class="badge guest">客人</div>` : ""}
            ${p.twins && p.twins.length ? `<div class="badge">疑似与 ${twinBadge(p)} 为同一人</div>` : ""}
          </div>
        </article>
      `).join("");
      for (const card of $("grid").querySelectorAll(".card")) {
        card.onclick = () => openPerson(card.dataset.id);
      }
    }

    function escapeHtml(s) {
      const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
      return String(s).replace(/[&<>"']/g, (c) => map[c]);
    }

    function selectedDays() {
      return WEEKDAYS.filter(([id]) => {
        const el = document.querySelector(`#workDays .day[data-day="${id}"]`);
        return el && el.classList.contains("on");
      }).map(([id]) => id);
    }

    function selectedStream() {
      const on = document.querySelector("#streamPick .day.on");
      return (on && on.dataset.stream) || "sub";
    }

    function renderWatch() {
      const report = watchReport || { settings: {}, state: {}, today: { sessions: [] } };
      const cap = captureSettings || { source: "auto", cameras: [] };
      const s = report.settings || {};
      const st = report.state || {};
      const today = report.today || { sessions: [] };
      $("summary").textContent = s.hours_label
        ? `${s.hours_label}${s.on_duty ? " · 检测中" : " · 现在下班不计"}`
        : "离岗分析";
      const status = $("watchStatus");
      if (status) {
        const cameras = cap.cameras || [];
        const sourceLabel = cap.source === "rtsp"
          ? (cameras.length ? `局域网 · ${cameras.length} 路` : "局域网监控")
          : cap.source === "usb" ? "USB 摄像头" : "Pocket 自动";
        status.hidden = false;
        status.innerHTML = `
          <div class="facts">
            <span>当前 <b>${escapeHtml(st.label || "—")}</b></span>
            <span>今天离岗 <b>${today.away_count || 0}</b></span>
            <span>累计 <b>${escapeHtml(today.away_label || "0 秒")}</b></span>
            <span class="danger">报警 <b>${today.alarm_count || 0}</b></span>
            <span>${escapeHtml(sourceLabel)}</span>
          </div>
          <div class="row" style="margin:0;gap:8px">
            <button type="button" class="ghost" id="openPresent">在岗人员</button>
            <button type="button" class="ghost" id="openRecords">离岗记录</button>
          </div>
        `;
        const openPresent = $("openPresent");
        if (openPresent) openPresent.onclick = () => openPresentView();
        const openRecords = $("openRecords");
        if (openRecords) openRecords.onclick = () => openRecordsView();
      }
      paintMonitorBar();
      paintScene(sceneState);
      paintMap(mapState);
      paintMocap(mocapState);
    }

    function openWatchSettings() {
      const report = watchReport || { settings: {}, state: {}, today: { sessions: [] } };
      const cap = captureSettings || { source: "auto", stream: "sub", port: 554, channel: 1, username: "admin", cameras: [] };
      const cameras = cap.cameras || [];
      const editId = editingCameraId !== null ? editingCameraId : (cap.camera_id || "");
      const adding = editId === "";
      const selectedCam = adding
        ? { stream: "sub", port: 554, channel: 1, username: "admin" }
        : (cameras.find((c) => c.id === editId) || cameras[0] || cap);
      const capName = selectedCam.name || "";
      const s = report.settings || {};
      const days = new Set(s.workdays || [1, 2, 3, 4, 5]);
      watchSettingsOpen = true;
      selected = null;
      $("panel").classList.add("settings");
      $("btnWatchSettings").classList.add("active");
      $("panel").innerHTML = `
        <div class="panel-head">
          <div>
            <p class="kicker">离岗分析</p>
            <strong>监测设置</strong>
          </div>
          <button class="ghost" type="button" id="close">关闭</button>
        </div>
        <div class="settings-block" style="margin-top:0;padding-top:0;border-top:0">
          <h3>摄像机</h3>
          <p class="hint" style="margin-top:0">改 IP、通道和码流。要看哪几路，关抽屉后点监测画面上的通道。</p>
          <div class="settings-grid">
            <label class="span-2">视频源
              <select id="capSource">
                <option value="auto" ${cap.source === "auto" ? "selected" : ""}>Pocket 自动</option>
                <option value="usb" ${cap.source === "usb" ? "selected" : ""}>USB / 摄像头</option>
                <option value="rtsp" ${cap.source === "rtsp" ? "selected" : ""}>局域网监控</option>
              </select>
            </label>
          </div>
          <div id="rtspFields" ${cap.source === "rtsp" ? "" : "hidden"}>
            <div class="settings-grid">
              <label class="span-2">编辑哪路
                <select id="capCamPick" class="cam-pick">
                  <option value="" ${adding ? "selected" : ""}>添加新摄像机…</option>
                  ${cameras.map((cam) => `
                    <option value="${escapeHtml(cam.id)}" ${!adding && cam.id === selectedCam.id ? "selected" : ""}>${escapeHtml(cam.name || cam.host || cam.id)} · 通道 ${cam.channel || 1}</option>
                  `).join("")}
                </select>
              </label>
              <input id="capCamId" type="hidden" value="${escapeHtml(adding ? "" : (selectedCam.id || ""))}" />
              <label class="span-2">名称 <input id="capName" type="text" value="${escapeHtml(capName)}" placeholder="工位区 / 门口" /></label>
              <label class="span-2">摄像机 / NVR IP <input id="capHost" class="host" type="text" value="${escapeHtml(selectedCam.host || "")}" placeholder="192.168.0.177" /></label>
              <label>端口 <input id="capPort" type="number" min="1" max="65535" value="${Number(selectedCam.port || 554)}" /></label>
              <label>通道 <input id="capChannel" type="number" min="1" max="64" value="${Number(selectedCam.channel || 1)}" /></label>
              <label>账号 <input id="capUser" type="text" value="${escapeHtml(selectedCam.username || "admin")}" /></label>
              <label>密码 <input id="capPass" type="password" value="" placeholder="${selectedCam.has_password ? "已保存，留空不改" : "摄像机密码"}" autocomplete="off" /></label>
            </div>
            <p class="hint" style="margin:12px 0 0">码流 ${escapeHtml(selectedCam.stream_label || "")}${selectedCam.url ? " · " + escapeHtml(selectedCam.url) : ""}。</p>
            <div class="stream-pick" id="streamPick">
              ${[["main", "主码流"], ["sub", "子码流"], ["third", "第三码流"]].map(([id, name]) =>
                `<button type="button" class="day ${selectedCam.stream === id ? "on" : ""}" data-stream="${id}">${name}</button>`
              ).join("")}
            </div>
            <div class="settings-actions">
              <button type="button" class="ghost" id="addCamera">添加一路</button>
              <button type="button" class="ghost" id="removeCamera" ${cameras.length ? "" : "hidden"}>删除这路</button>
            </div>
          </div>
          <div class="settings-actions">
            <button type="button" id="saveCapture">保存摄像机</button>
          </div>
        </div>
        <div class="settings-block">
          <h3>上班时间</h3>
          <p class="hint" style="margin-top:0">上班时段里离开镜头超过报警秒数会记一笔。只冒一下头不算来过。工位上还有别人时，也记这个人自己的离岗。客人除外。</p>
          <div class="settings-grid">
            <label>上班 <input id="workStart" type="time" value="${escapeHtml(s.work_start || "09:00")}" /></label>
            <label>下班 <input id="workEnd" type="time" value="${escapeHtml(s.work_end || "18:30")}" /></label>
            <label class="span-2">离岗报警（秒） <input id="awaySec" type="number" min="3" max="3600" step="1" value="${Number(s.away_s || 30)}" /></label>
          </div>
          <div class="days" id="workDays">
            ${WEEKDAYS.map(([id, name]) => `<button type="button" class="day ${days.has(id) ? "on" : ""}" data-day="${id}">周${name}</button>`).join("")}
          </div>
          <div class="settings-actions">
            <button type="button" id="saveHours">保存上班时间</button>
          </div>
        </div>
      `;
      $("drawer").classList.add("open");
      $("close").onclick = closeDrawer;
      for (const btn of $("panel").querySelectorAll("#workDays .day")) {
        btn.onclick = () => btn.classList.toggle("on");
      }
      const sourceSel = $("capSource");
      if (sourceSel) {
        sourceSel.onchange = () => {
          $("rtspFields").hidden = sourceSel.value !== "rtsp";
        };
      }
      for (const btn of $("panel").querySelectorAll("#streamPick .day")) {
        btn.onclick = () => {
          for (const other of $("panel").querySelectorAll("#streamPick .day")) {
            other.classList.toggle("on", other === btn);
          }
        };
      }
      $("saveHours").onclick = saveHours;
      $("saveCapture").onclick = saveCapture;
      const addBtn = $("addCamera");
      if (addBtn) addBtn.onclick = beginAddCamera;
      const removeBtn = $("removeCamera");
      if (removeBtn) removeBtn.onclick = removeCamera;
      const pick = $("capCamPick");
      if (pick) pick.onchange = () => fillCameraForm(pick.value);
    }

    function durationLabel(seconds) {
      const total = Math.max(0, Math.round(Number(seconds) || 0));
      if (total < 60) return total + " 秒";
      const minutes = Math.floor(total / 60);
      const sec = total % 60;
      if (minutes < 60) return minutes + " 分 " + sec + " 秒";
      return Math.floor(minutes / 60) + " 小时 " + (minutes % 60) + " 分";
    }

    function rankSessions(sessions) {
      const by = new Map();
      for (const row of sessions || []) {
        const id = row.person_id || row.name || "";
        if (!id) continue;
        const item = by.get(id) || {
          person_id: row.person_id || "",
          name: row.name || (row.names && row.names[0]) || id,
          photo: row.photo || "",
          away_count: 0,
          alarm_count: 0,
          away_s: 0,
          longest_s: 0,
          last_ts: "",
        };
        item.away_count += 1;
        if (row.alarm) item.alarm_count += 1;
        const dur = Number(row.duration_s || 0);
        item.away_s += dur;
        if (dur > item.longest_s) item.longest_s = dur;
        const ts = row.start_ts || "";
        if (ts >= item.last_ts) {
          item.last_ts = ts;
          item.name = row.name || (row.names && row.names[0]) || item.name;
          if (row.photo) item.photo = row.photo;
        }
        by.set(id, item);
      }
      return [...by.values()].sort((a, b) => (b.away_s - a.away_s) || (b.alarm_count - a.alarm_count) || (b.away_count - a.away_count));
    }

    function personThumb(row) {
      if (row.photo) return `<img src="/media/${escapeHtml(row.photo)}" alt="" />`;
      return `<div class="ph">无图</div>`;
    }

    function rosterMeta(row) {
      const bits = [];
      if (row.seat_label) bits.push(row.seat_label);
      if (row.start_ts && row.status === "at_desk") bits.push("入镜 " + row.start_ts);
      if (row.start_ts && (row.status === "away" || row.status === "alarm")) bits.push("离开 " + row.start_ts);
      if (row.guest) bits.push("客人");
      return bits.join(" · ");
    }

    function rosterTag(row) {
      if (row.status === "alarm") return `<span class="tag alarm">${escapeHtml(row.label || "离岗报警")}</span>`;
      if (row.status === "at_desk") return `<span class="tag">${escapeHtml(row.label || "在岗")}</span>`;
      return `<span class="tag off">${escapeHtml(row.label || "")}</span>`;
    }

    function rosterRow(row, i) {
      const dur = row.status === "at_desk" || row.status === "away" || row.status === "alarm"
        ? escapeHtml(row.duration || "")
        : "";
      return `
        <div class="rank" data-id="${escapeHtml(row.person_id || "")}">
          <span class="n">${i + 1}</span>
          ${personThumb(row)}
          <div>
            <strong>${escapeHtml(row.name || row.person_id || "")}${row.guest ? ` <span class="badge guest">客人</span>` : ""}</strong>
            <small>${escapeHtml(rosterMeta(row) || "尚未指定工位")}</small>
          </div>
          <div class="session-end">
            ${dur ? `<b>${dur}</b>` : ""}
            ${rosterTag(row)}
          </div>
        </div>`;
    }

    function renderPresent() {
      const report = watchReport || { settings: {}, roster: {}, today: {} };
      const s = report.settings || {};
      const roster = report.roster || {};
      const q = $("q").value.trim().toLowerCase();
      const all = roster.people || [];
      const matched = all.filter((row) => {
        if (!q) return true;
        const blob = (row.name || "") + " " + (row.seat_label || "") + " " + (row.label || "");
        return blob.toLowerCase().includes(q);
      });
      const present = matched.filter((row) => row.status === "at_desk");
      const empty = matched.filter((row) => ["away", "alarm", "waiting", "stale"].includes(row.status));
      const count = Number(roster.count || 0);
      $("summary").textContent = roster.fresh
        ? `当前在岗 ${count} 人`
        : "在岗人员";
      const emptyCopy = !roster.fresh
        ? "打开监测后，这里会列出镜头里认到的人，以及指定了工位但人不在的空位。"
        : (s.on_duty === false
          ? "现在下班不计离岗。镜头里认到的人仍会列在这里。"
          : "镜头里认到、或人还坐在指定工位上的会算在岗。工位上没人的才列在空位。客人不计入在岗人数。");
      $("presentPanel").innerHTML = `
        <section class="watch-card records-hero">
          <div class="watch-head">
            <h3>在岗人员</h3>
            <p class="hint" style="margin:0">${s.hours_label ? escapeHtml(s.hours_label) + (s.on_duty ? " · 检测中" : " · 现在下班不计") : "按监测画面里认出的人统计"}</p>
          </div>
          <div class="stats">
            <div class="stat live"><span>当前在岗</span><b>${count}</b></div>
            <div class="stat"><span>工位空着</span><b>${Number(roster.empty_count || 0)}</b></div>
            <div class="stat"><span>客人在镜</span><b>${Number(roster.guest_count || 0)}</b></div>
            <div class="stat"><span>指定工位</span><b>${Number(roster.seated_count || 0)}</b></div>
          </div>
        </section>
        ${!all.length ? `
          <section class="watch-card">
            <div class="empty records-empty">
              <strong>${roster.fresh ? "现在没有在岗人员" : "还看不到谁在岗"}</strong>
              <p style="margin:0">${emptyCopy}</p>
            </div>
          </section>
        ` : `
          <div class="records-body">
            <section class="watch-card">
              <h3>当前在岗</h3>
              ${present.length ? present.map((row, i) => rosterRow(row, i)).join("") : `<div class="empty" style="padding:28px 0">${q ? "没有符合筛选的人。" : (roster.fresh ? "镜头里还没有认出人。" : emptyCopy)}</div>`}
            </section>
            <section class="watch-card">
              <h3>工位空着</h3>
              ${empty.length ? empty.map((row, i) => rosterRow(row, i)).join("") : `<div class="empty" style="padding:28px 0">${q ? "没有符合筛选的空位。" : (Number(roster.seated_count || 0) ? "指定工位的人都在。" : "还没有指定工位。在「离岗分析」监测画面上点人框即可记下位置。")}</div>`}
            </section>
          </div>
        `}
      `;
      for (const row of $("presentPanel").querySelectorAll(".rank[data-id]")) {
        row.style.cursor = "pointer";
        row.onclick = () => {
          const id = row.dataset.id;
          if (!id) return;
          view = "people";
          render();
          openPerson(id);
        };
      }
    }

    function renderRecords() {
      const report = watchReport || { settings: {}, state: {}, today: { sessions: [] } };
      const s = report.settings || {};
      const today = report.today || { sessions: [] };
      const q = $("q").value.trim().toLowerCase();
      const all = today.sessions || [];
      const matched = all.filter((row) => {
        if (!q) return true;
        const blob = (row.name || "") + " " + (row.names || []).join(" ") + " " + (row.start_ts || "");
        return blob.toLowerCase().includes(q);
      });
      const alarmN = matched.filter((row) => row.alarm).length;
      const liveN = matched.filter((row) => row.live).length;
      const sessions = matched.filter((row) => {
        if (recordsFilter === "alarm") return row.alarm;
        if (recordsFilter === "live") return row.live;
        return true;
      });
      const ranks = rankSessions(sessions);
      const peopleN = rankSessions(all).length;
      $("summary").textContent = today.date
        ? `今天 ${today.date} · ${today.away_count || 0} 次离岗`
        : "离岗记录";
      const emptyCopy = q
        ? "没有符合筛选的记录。"
        : `上班时段里离开镜头超过 ${Number(s.away_s || 30)} 秒会按人记一笔。只冒一下头不算来过。工位上还有别人时，也会记这个人自己的离岗。客人不计入。`;
      $("recordsPanel").innerHTML = `
        <section class="watch-card records-hero">
          <div class="watch-head">
            <h3>今天 ${escapeHtml(today.date || "")}</h3>
            <p class="hint" style="margin:0">离开镜头超过 ${Number(s.away_s || 30)} 秒记一笔；达到报警秒数会标成报警。</p>
          </div>
          <div class="stats">
            <div class="stat"><span>离岗次数</span><b>${today.away_count || 0}</b></div>
            <div class="stat"><span>累计离开</span><b>${escapeHtml(today.away_label || "0 秒")}</b></div>
            <div class="stat danger"><span>报警次数</span><b>${today.alarm_count || 0}</b></div>
            <div class="stat"><span>涉及人数</span><b>${peopleN}</b></div>
          </div>
        </section>
        ${!all.length ? `
          <section class="watch-card">
            <div class="empty records-empty">
              <strong>今天还没有离岗</strong>
              <p style="margin:0">${emptyCopy}</p>
            </div>
          </section>
        ` : `
          <div class="records-body">
            <section class="watch-card">
              <h3>按人</h3>
              ${ranks.length ? ranks.map((row, i) => `
                <div class="rank" data-id="${escapeHtml(row.person_id || "")}">
                  <span class="n">${i + 1}</span>
                  ${personThumb(row)}
                  <div>
                    <strong>${escapeHtml(row.name || row.person_id || "")}</strong>
                    <small>${row.away_count} 次${row.alarm_count ? " · 报警 " + row.alarm_count + " 次" : ""}${row.last_ts ? " · 最近 " + escapeHtml(row.last_ts) : ""}</small>
                  </div>
                  <strong>${escapeHtml(durationLabel(row.away_s))}</strong>
                </div>
              `).join("") : `<div class="empty" style="padding:28px 0">没有符合筛选的人。</div>`}
            </section>
            <section class="watch-card">
              <div class="watch-head">
                <h3>流水</h3>
                <div class="records-filters">
                  <button type="button" class="day ${recordsFilter === "all" ? "on" : ""}" data-filter="all">全部 ${matched.length}</button>
                  <button type="button" class="day ${recordsFilter === "alarm" ? "on" : ""}" data-filter="alarm">报警 ${alarmN}</button>
                  <button type="button" class="day ${recordsFilter === "live" ? "on" : ""}" data-filter="live">进行中 ${liveN}</button>
                </div>
              </div>
              ${sessions.length ? sessions.map((row) => `
                <div class="session ${row.alarm ? "is-alarm" : ""} ${row.live ? "is-live" : ""}" data-id="${escapeHtml(row.person_id || "")}">
                  ${personThumb(row)}
                  <div>
                    <strong>${escapeHtml(row.name || (row.names && row.names[0]) || "未识别")}</strong>
                    <small class="when">${escapeHtml(row.start_ts || "")} → ${escapeHtml(row.end_ts || "")}</small>
                  </div>
                  <div class="session-end">
                    <b>${escapeHtml(row.duration || "")}</b>
                    <span class="tag ${row.alarm ? "alarm" : (row.live ? "" : "off")}">${row.live ? "进行中" : (row.alarm ? "已报警" : "暂离")}</span>
                  </div>
                </div>
              `).join("") : `<div class="empty" style="padding:36px 0">${q || recordsFilter !== "all" ? "没有符合筛选的记录。" : emptyCopy}</div>`}
            </section>
          </div>
        `}
      `;
      for (const btn of $("recordsPanel").querySelectorAll("[data-filter]")) {
        btn.onclick = () => {
          recordsFilter = btn.dataset.filter || "all";
          renderRecords();
        };
      }
      for (const row of $("recordsPanel").querySelectorAll(".rank, .session[data-id]")) {
        row.style.cursor = "pointer";
        row.onclick = () => {
          const id = row.dataset.id;
          if (!id) return;
          view = "people";
          render();
          openPerson(id);
        };
      }
    }

    function currentCameras() {
      return (captureSettings && captureSettings.cameras) || [];
    }

    function cameraById(id) {
      return currentCameras().find((cam) => cam.id === id) || null;
    }

    function fillCameraForm(id) {
      const cameras = currentCameras();
      const adding = !id;
      editingCameraId = adding ? "" : id;
      const cam = adding ? { stream: "sub", port: 554, channel: 1, username: "admin" } : (cameraById(id) || cameras[0] || {});
      if (!adding && cam.id) editingCameraId = cam.id;
      const pick = $("capCamPick");
      if (pick) pick.value = adding ? "" : (cam.id || "");
      if ($("capCamId")) $("capCamId").value = adding ? "" : (cam.id || "");
      if ($("capName")) $("capName").value = cam.name || "";
      if ($("capHost")) $("capHost").value = cam.host || "";
      if ($("capPort")) $("capPort").value = cam.port || 554;
      if ($("capChannel")) $("capChannel").value = cam.channel || 1;
      if ($("capUser")) $("capUser").value = cam.username || "admin";
      if ($("capPass")) {
        $("capPass").value = "";
        $("capPass").placeholder = cam.has_password ? "已保存，留空不改" : "摄像机密码";
      }
      for (const btn of document.querySelectorAll("#streamPick .day")) {
        btn.classList.toggle("on", btn.dataset.stream === (cam.stream || "sub"));
      }
      const removeBtn = $("removeCamera");
      if (removeBtn) removeBtn.hidden = adding || !cameras.length;
    }

    function paintMonitorBar() {
      const bar = $("monitorBar");
      const chips = $("monitorChips");
      const count = $("monitorCount");
      if (!bar || !chips) return;
      const cap = captureSettings || {};
      const cameras = cap.cameras || [];
      const rtsp = cap.source === "rtsp" && cameras.length > 0;
      bar.hidden = !rtsp;
      const onCount = cameras.filter((cam) => cam.monitor).length;
      if (count) count.textContent = rtsp ? `监测 ${onCount} / ${cameras.length}` : "";
      const key = `${cap.source || ""}|` + cameras.map((cam) => `${cam.id}:${cam.monitor ? 1 : 0}`).join(",");
      if (key === monitorPaintKey && chips.childElementCount === cameras.length) return;
      monitorPaintKey = key;
      if (!rtsp) {
        chips.innerHTML = "";
        return;
      }
      chips.innerHTML = cameras.map((cam) => `
        <button type="button" class="day ${cam.monitor ? "on" : ""}" data-id="${escapeHtml(cam.id)}" aria-pressed="${cam.monitor ? "true" : "false"}">${escapeHtml(cam.name || cam.host || cam.id)}</button>
      `).join("");
      for (const btn of chips.querySelectorAll(".day")) {
        btn.onclick = () => toggleMonitor(btn.dataset.id);
      }
      const allBtn = $("monitorAll");
      if (allBtn) allBtn.disabled = onCount === cameras.length;
    }

    async function setMonitorIds(ids, label) {
      if (monitorBusy) return;
      monitorBusy = true;
      try {
        captureSettings = await api("/api/capture", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ source: "rtsp", monitor_ids: ids }),
        });
        monitorPaintKey = "";
        paintMonitorBar();
        const cameras = captureSettings.cameras || [];
        const n = cameras.filter((cam) => cam.monitor).length;
        toast(label || `已监测 ${n} / ${cameras.length} 路`);
      } catch (err) {
        toast(err.message);
        monitorPaintKey = "";
        paintMonitorBar();
      } finally {
        monitorBusy = false;
      }
    }

    function toggleMonitor(id) {
      const cameras = currentCameras();
      const cam = cameraById(id);
      const next = cameras.filter((row) => (row.id === id ? !row.monitor : row.monitor)).map((row) => row.id);
      const name = (cam && (cam.name || cam.id)) || id;
      const turningOn = !(cam && cam.monitor);
      setMonitorIds(next, turningOn ? `${name} 已加入监测` : `${name} 已关掉`);
    }

    function beginAddCamera() {
      fillCameraForm("");
      if ($("capName")) $("capName").focus();
    }

    async function removeCamera() {
      const id = $("capCamId") && $("capCamId").value;
      if (!id) return toast("先选一路再删");
      if (!confirm("删除这路摄像机？")) return;
      try {
        captureSettings = await api("/api/capture", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ remove_camera_id: id }),
        });
        editingCameraId = captureSettings.camera_id || "";
        monitorPaintKey = "";
        render();
        if (watchSettingsOpen) openWatchSettings();
        toast("已删除");
      } catch (err) {
        toast(err.message);
      }
    }

    async function saveCapture() {
      try {
        const source = $("capSource").value;
        const body = { source };
        if (source === "rtsp") {
          const camera = {
            id: $("capCamId").value || undefined,
            name: $("capName").value.trim(),
            host: $("capHost").value.trim(),
            port: Number($("capPort").value) || 554,
            channel: Number($("capChannel").value) || 1,
            username: $("capUser").value.trim() || "admin",
            stream: selectedStream(),
          };
          const password = $("capPass").value;
          if (password) camera.password = password;
          body.camera = camera;
        }
        captureSettings = await api("/api/capture", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        editingCameraId = captureSettings.camera_id || null;
        monitorPaintKey = "";
        render();
        if (watchSettingsOpen) openWatchSettings();
        toast(source === "rtsp" ? `已保存 ${captureSettings.cameras && captureSettings.cameras.length ? (captureSettings.cameras.find((c) => c.id === captureSettings.camera_id) || {}).name || "摄像机" : ""}，跟拍进程几秒内重连` : "已保存监测源");
      } catch (err) {
        toast(err.message);
      }
    }

    async function saveHours() {
      try {
        watchReport = await api("/api/watch", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            work_start: $("workStart").value || "09:00",
            work_end: $("workEnd").value || "18:30",
            workdays: selectedDays(),
            away_s: Number($("awaySec").value) || 30,
          }),
        });
        render();
        if (watchSettingsOpen) openWatchSettings();
        toast("已保存上班时间");
      } catch (err) {
        toast(err.message);
      }
    }

    function twinName(p) {
      const t = (p.twins || [])[0];
      if (!t) return "";
      return t.a === p.id ? t.b_name : t.a_name;
    }

    function twinPct(t) {
      const n = Number(t && t.sim);
      if (!Number.isFinite(n) || n <= 0) return "";
      return ` ${Math.round(n * 100)}%`;
    }

    function twinBadge(p) {
      const t = (p.twins || [])[0];
      if (!t) return "";
      return `${escapeHtml(twinName(p))}${twinPct(t)}`;
    }

    function seatLabel(p) {
      const seats = p.seats || [];
      if (!seats.length) return "";
      return seats.map((s) => s.camera_name || s.camera_id).join("、");
    }

    function openPerson(id) {
      selected = people.find((p) => p.id === id);
      if (!selected) return;
      watchSettingsOpen = false;
      $("panel").classList.remove("settings");
      $("btnWatchSettings").classList.remove("active");
      const p = selected;
      $("panel").innerHTML = `
        <div class="panel-head">
          <div>
            <p class="kicker">人物档案</p>
            <strong>${escapeHtml(p.name)}</strong>
          </div>
          <button class="ghost" type="button" id="close">关闭</button>
        </div>
        ${p.photo_url ? `<img class="cover" src="${p.photo_url}?t=${encodeURIComponent(p.updated_at || "")}" alt="" />` : `<div class="cover" style="display:flex;align-items:center;justify-content:center;color:var(--muted)">尚无相片，监测认出后会自动留底</div>`}
        <label>姓名</label>
        <input id="name" type="text" value="${escapeHtml(p.name)}" />
        <label>备注</label>
        <textarea id="note" placeholder="例如：左边穿条纹衬衫">${escapeHtml(p.note || "")}</textarea>
        <label>固定工位</label>
        ${(p.seats || []).length ? (p.seats || []).map((s) => `
          <div class="row" style="margin-bottom:8px">
            <span class="hint" style="flex:1;margin:0">${escapeHtml(s.camera_name || s.camera_id)} · ${s.locked ? "已指定" : ((s.hits || 0) + " 次")}</span>
            <button class="ghost" type="button" data-clear-seat="${escapeHtml(s.camera_id)}">清除</button>
          </div>
        `).join("") : `<p class="hint" style="margin-top:0">在「离岗分析」监测画面上点人框，即可把这个人登记到该路摄像头的位置。</p>`}
        <label class="check">
          <input type="checkbox" id="guest" ${p.guest ? "checked" : ""} />
          <span>客人（不计入离岗和报警统计）</span>
        </label>
        <p class="hint">客人仍会出现在监测画面里，只是离岗分析会跳过。</p>
        <div class="row">
          <button type="button" id="save">保存</button>
          <button class="ghost" type="button" id="refreshCover">设当前图为封面</button>
        </div>
        <label>相片留底</label>
        <div class="snaps" id="snaps">
          ${p.photos.map((ph) => `<img data-name="${escapeHtml(ph.name)}" class="${ph.cover ? "cover" : ""}" src="${ph.url}" title="${ph.mtime}${ph.cover ? " 封面" : ""}" />`).join("") || '<div class="hint">还没有底片</div>'}
        </div>
        <div class="drop">
          上传相片（可更新封面）
          <div style="margin-top:8px"><input id="file" type="file" accept="image/*" /></div>
        </div>
        <label>这是重复档，并入</label>
        <div class="row">
          <select id="mergeTo" style="flex:1">
            <option value="">选择已有的同一个人…</option>
            ${people.filter((x) => x.id !== p.id).sort((a, b) => (b.samples || 0) - (a.samples || 0)).map((x) => {
              const hit = (p.twins || []).find((t) => t.a === x.id || t.b === x.id);
              const mark = hit ? `（疑似同一人${twinPct(hit)}）` : "";
              return `<option value="${x.id}">${escapeHtml(x.name)}${mark}</option>`;
            }).join("")}
          </select>
          <button type="button" id="doMerge">并入</button>
        </div>
        <p class="hint">跟拍里侧脸对不上时以前会新开一档。以后会优先并回已有人物；这里仍可手动合并。</p>
        <div class="row"><button class="danger" type="button" id="del">删除此人</button></div>
      `;
      $("drawer").classList.add("open");
      $("close").onclick = closeDrawer;
      $("save").onclick = savePerson;
      $("del").onclick = deletePerson;
      $("file").onchange = uploadPhoto;
      $("doMerge").onclick = mergeInto;
      $("refreshCover").onclick = () => toast("点下面一张底片即可设为封面");
      for (const btn of $("panel").querySelectorAll("[data-clear-seat]")) {
        btn.onclick = () => clearSeat(p.id, btn.dataset.clearSeat);
      }
      for (const img of $("snaps").querySelectorAll("img")) {
        img.onclick = () => setCover(img.dataset.name);
      }
    }

    function closeDrawer() {
      $("drawer").classList.remove("open");
      $("panel").classList.remove("settings");
      $("btnWatchSettings").classList.remove("active");
      watchSettingsOpen = false;
      selected = null;
    }

    async function savePerson() {
      if (!selected) return;
      const name = $("name").value.trim();
      const note = $("note").value;
      const guest = $("guest").checked;
      const updated = await api("/api/people/" + selected.id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, note, guest }),
      });
      merge(updated);
      toast(updated.guest ? "已标为客人，离岗不再统计" : "已保存 " + updated.name);
      openPerson(updated.id);
    }

    async function clearSeat(personId, cameraId) {
      const qs = cameraId ? ("?camera_id=" + encodeURIComponent(cameraId)) : "";
      const updated = await api("/api/people/" + personId + "/seats" + qs, { method: "DELETE" });
      merge(updated);
      toast("已清除工位，之后会重新学习");
      openPerson(updated.id);
    }

    async function deletePerson() {
      if (!selected || !confirm("删除 " + selected.name + " 以及全部相片？")) return;
      await api("/api/people/" + selected.id, { method: "DELETE" });
      people = people.filter((p) => p.id !== selected.id);
      closeDrawer();
      render();
      toast("已删除");
    }

    async function refreshPeople() {
      const editingSettings = watchSettingsOpen && document.activeElement && $("panel").contains(document.activeElement);
      const pickingSeat = seatPickOpen();
      people = await api("/api/people");
      if (view === "watch" || view === "present" || view === "records") {
        watchReport = await api("/api/watch");
        if (view === "watch" && !editingSettings && !pickingSeat) {
          try { captureSettings = await api("/api/capture"); } catch (_) {}
          try { sceneState = { ...sceneState, ...(await api("/api/scene")) }; } catch (_) {}
          try { mapState = { ...mapState, ...(await api("/api/map")) }; } catch (_) {}
          try { mocapState = { ...mocapState, ...(await api("/api/mocap")) }; } catch (_) {}
        }
      }
      if (selected && !people.some((p) => p.id === selected.id)) {
        selected = null;
      }
      if (!editingSettings && !pickingSeat) render();
    }

    async function mergeInto() {
      if (!selected) return;
      const keepId = $("mergeTo").value;
      if (!keepId) return toast("先选要并入的人");
      const keep = people.find((p) => p.id === keepId);
      if (!confirm(`把「${selected.name}」并入「${keep ? keep.name : keepId}」，并删除当前这条？`)) return;
      try {
        const updated = await api("/api/people/" + keepId + "/merge", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ source_id: selected.id }),
        });
        await refreshPeople();
        toast("已合并到 " + updated.name);
        openPerson(keepId);
      } catch (err) {
        toast(err.message);
      }
    }

    async function uploadPhoto(ev) {
      const file = ev.target.files[0];
      if (!file || !selected) return;
      const fd = new FormData();
      fd.append("file", file);
      fd.append("as_cover", "true");
      const updated = await api("/api/people/" + selected.id + "/photos", { method: "POST", body: fd });
      merge(updated);
      toast("已加入相片");
      openPerson(updated.id);
    }

    async function setCover(name) {
      const updated = await api("/api/people/" + selected.id + "/cover", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ filename: name }),
      });
      merge(updated);
      openPerson(updated.id);
      toast("已设为封面");
    }

    function merge(person) {
      const i = people.findIndex((p) => p.id === person.id);
      if (i >= 0) people[i] = person;
      else people.unshift(person);
      render();
    }

    $("btnNew").onclick = () => {
      watchSettingsOpen = false;
      $("panel").classList.remove("settings");
      $("btnWatchSettings").classList.remove("active");
      $("panel").innerHTML = `
        <div class="panel-head">
          <div>
            <p class="kicker">人物库</p>
            <strong>登记新人</strong>
          </div>
          <button class="ghost" type="button" id="close">关闭</button>
        </div>
        <label>姓名</label>
        <input id="newName" type="text" placeholder="例如：小李" />
        <label>正面相片</label>
        <input id="newFile" type="file" accept="image/*" />
        <p class="hint">照片里需要能看清脸，系统会提取特征并裁一张封面留底。</p>
        <div class="row"><button type="button" id="create">登记</button></div>
      `;
      $("drawer").classList.add("open");
      $("close").onclick = closeDrawer;
      $("create").onclick = async () => {
        const name = $("newName").value.trim();
        const file = $("newFile").files[0];
        if (!file) return toast("请选一张照片");
        const fd = new FormData();
        fd.append("file", file);
        if (name) fd.append("name", name);
        try {
          const person = await api("/api/people", { method: "POST", body: fd });
          merge(person);
          openPerson(person.id);
          toast("已登记 " + person.name);
        } catch (err) {
          toast(err.message);
        }
      };
    };

    $("btnPeople").onclick = () => {
      view = "people";
      render();
    };
    $("q").oninput = render;

      } catch (err) { toast(err.message); }
      render();

      } catch (err) { toast(err.message); }
